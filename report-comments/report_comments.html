<!-- report-comments widget v1 (2026-11-10). Paste this whole block just before </body> of any self-contained HTML report.
     Select text, click Comment, save. "Comments (n)" bottom right lists them, takes general notes, and copies all
     comments (section heading + quoted text + note) to paste back into the Claude Code session.
     Comments persist per file in localStorage. Needs CSS variables optional: falls back to its own colours. -->
<button id="rcBtn" type="button" hidden>Comment</button>
<div id="rcBox" hidden>
  <div class="rc-q" id="rcQuote"></div>
  <textarea id="rcText" rows="4" placeholder="Your comment (Ctrl+Enter saves)"></textarea>
  <div class="rc-row"><button type="button" id="rcSave">Save</button><button type="button" id="rcCancel" class="rc-ghost">Cancel</button></div>
</div>
<button id="rcToggle" type="button" title="Select text on the page to comment on it">Comments (<span id="rcCount">0</span>)</button>
<aside id="rcPanel" hidden>
  <div class="rc-row rc-head"><strong>Your comments</strong><button type="button" id="rcClose" class="rc-ghost">Close</button></div>
  <p class="rc-msg">Select text on the page and click Comment. When done, copy and paste into the Claude Code session.</p>
  <ol id="rcList"></ol>
  <textarea id="rcGeneral" rows="3" placeholder="General comment (not tied to a selection)"></textarea>
  <div class="rc-row"><button type="button" id="rcAddGen" class="rc-ghost">Add general comment</button></div>
  <div class="rc-row"><button type="button" id="rcCopy">Copy all comments</button><button type="button" id="rcClear" class="rc-ghost">Clear all</button></div>
  <p class="rc-msg" id="rcMsg"></p>
</aside>
<style>
#rcBtn,#rcToggle,#rcBox,#rcPanel{--rc-acc:var(--acc,#0b5cad);--rc-card:var(--card,#fff);--rc-fg:var(--fg,#1d1d1b);--rc-bg:var(--bg,#fafaf8);--rc-line:var(--line,#deded8);--rc-mut:var(--mut,#5f5f5a);--rc-warn:var(--warn,#9a5b00);--rc-warnbg:var(--warnbg,#fff5e0)}
@media (prefers-color-scheme:dark){#rcBtn,#rcToggle,#rcBox,#rcPanel{--rc-acc:var(--acc,#6aaef0);--rc-card:var(--card,#1e1e1c);--rc-fg:var(--fg,#e8e8e3);--rc-bg:var(--bg,#161615);--rc-line:var(--line,#33332f);--rc-mut:var(--mut,#a3a39c);--rc-warn:var(--warn,#f0b75a);--rc-warnbg:var(--warnbg,#2c2414)}}
#rcBtn{position:absolute;z-index:1000}
#rcBtn,#rcToggle,#rcBox button,#rcPanel button{font:600 .9rem system-ui,sans-serif;border:1px solid var(--rc-acc);background:var(--rc-acc);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
#rcBox button.rc-ghost,#rcPanel button.rc-ghost{background:transparent;color:var(--rc-acc)}
#rcToggle{position:fixed;right:16px;bottom:16px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#rcBox,#rcPanel{position:fixed;z-index:1001;background:var(--rc-card);color:var(--rc-fg);border:1px solid var(--rc-line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:12px;font:15px/1.5 system-ui,sans-serif}
#rcBox{left:50%;top:20%;transform:translateX(-50%);width:min(440px,calc(100vw - 32px))}
#rcPanel{right:16px;bottom:64px;width:min(420px,calc(100vw - 32px));max-height:70vh;overflow:auto}
#rcBox textarea,#rcPanel textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--rc-fg);background:var(--rc-bg);border:1px solid var(--rc-line);border-radius:6px;padding:6px;margin:8px 0}
.rc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc-head{justify-content:space-between}
.rc-q{font-size:.88rem;color:var(--rc-mut);border-left:3px solid var(--rc-warn);padding-left:8px;max-height:6em;overflow:auto}
#rcList{padding-left:20px;margin:8px 0}
#rcList li{margin:8px 0;font-size:.92rem}
#rcList .rc-s{color:var(--rc-mut);font-size:.8rem}
#rcList .rc-del{border:0;background:none;color:var(--rc-warn);padding:0 4px;font-size:.8rem;cursor:pointer}
.rc-msg{font-size:.85rem;color:var(--rc-mut);margin:6px 0 0}
mark.rc-mark{background:var(--rc-warnbg,#fff5e0);color:inherit;border-bottom:2px solid var(--rc-warn,#9a5b00)}
@media print{#rcBtn,#rcBox,#rcToggle,#rcPanel{display:none!important}}
</style>
<script>
(function(){
  var KEY='report-comments:'+location.pathname, items=[], pending=null;
  var ROOT=document.querySelector('main')||document.body;
  var $=function(id){return document.getElementById(id)};
  try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
  function store(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  function sectionOf(node){   // nearest heading before the selection
    var el=node&&node.nodeType===1?node:node&&node.parentElement;
    while(el&&el!==ROOT&&el!==document.body){
      for(var p=el;p;p=p.previousElementSibling){if(/^H[1-3]$/.test(p.tagName))return p.textContent.trim()}
      el=el.parentElement;
    }
    return 'Top of page';
  }
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(){
    $('rcCount').textContent=items.length;
    $('rcList').innerHTML=items.map(function(c,i){
      return '<li><div class="rc-s">'+esc(c.section)+'</div>'+(c.quote?'<div class="rc-q">'+esc(c.quote)+'</div>':'')+
        '<div>'+esc(c.note)+'</div><button class="rc-del" data-i="'+i+'" type="button">delete</button></li>'}).join('');
  }
  document.addEventListener('mouseup',function(e){
    if(e.target.closest&&e.target.closest('#rcBox,#rcPanel,#rcBtn,#rcToggle'))return;
    setTimeout(function(){
      var s=window.getSelection(), t=s?s.toString().trim():'';
      if(!t||!s.rangeCount||!ROOT.contains(s.anchorNode)){$('rcBtn').hidden=true;return}
      var r=s.getRangeAt(0), b=r.getBoundingClientRect();
      pending={quote:t.slice(0,600),section:sectionOf(r.startContainer),range:r.cloneRange()};
      var btn=$('rcBtn');btn.hidden=false;
      btn.style.top=(window.scrollY+b.bottom+6)+'px';
      btn.style.left=Math.max(8,Math.min(window.scrollX+b.left,window.scrollX+document.documentElement.clientWidth-110))+'px';
    },0);
  });
  $('rcBtn').addEventListener('click',function(){
    if(!pending)return;$('rcBtn').hidden=true;
    $('rcQuote').textContent=pending.quote;$('rcText').value='';$('rcBox').hidden=false;$('rcText').focus();
  });
  $('rcCancel').addEventListener('click',function(){$('rcBox').hidden=true;pending=null});
  $('rcSave').addEventListener('click',function(){
    var note=$('rcText').value.trim();if(!note||!pending)return;
    items.push({section:pending.section,quote:pending.quote,note:note});store();render();
    // ponytail: highlight only when the selection sits in one element; highlights are not restored after reload, comments are
    try{var m=document.createElement('mark');m.className='rc-mark';m.title=note;pending.range.surroundContents(m)}catch(e){}
    $('rcBox').hidden=true;pending=null;window.getSelection().removeAllRanges();
  });
  $('rcText').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('rcSave').click();if(e.key==='Escape')$('rcCancel').click()});
  $('rcToggle').addEventListener('click',function(){$('rcPanel').hidden=!$('rcPanel').hidden;render()});
  $('rcClose').addEventListener('click',function(){$('rcPanel').hidden=true});
  $('rcList').addEventListener('click',function(e){var i=e.target.getAttribute('data-i');if(i!==null){items.splice(+i,1);store();render()}});
  $('rcAddGen').addEventListener('click',function(){
    var n=$('rcGeneral').value.trim();if(!n)return;items.push({section:'General',quote:'',note:n});$('rcGeneral').value='';store();render();
  });
  function text(){
    return 'My comments on "'+document.title+'" ('+decodeURIComponent(location.pathname.split('/').pop())+'):\n\n'+items.map(function(c,i){
      return (i+1)+'. ['+c.section+']'+(c.quote?'\n   On: "'+c.quote.replace(/\s+/g,' ')+'"':'')+'\n   Comment: '+c.note}).join('\n\n');
  }
  $('rcCopy').addEventListener('click',function(){
    if(!items.length){$('rcMsg').textContent='Nothing to copy yet.';return}
    var t=text();
    function done(){$('rcMsg').textContent='Copied '+items.length+' comment(s). Paste them into the Claude Code session.'}
    function fallback(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done()}catch(e){$('rcMsg').textContent='Copy blocked by the browser. Select the list and copy it by hand.'}ta.remove()}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback)}else fallback();
  });
  $('rcClear').addEventListener('click',function(){if(items.length&&confirm('Delete all '+items.length+' comments?')){items=[];store();render()}});
  render();
})();
</script>
<!-- /report-comments widget -->
